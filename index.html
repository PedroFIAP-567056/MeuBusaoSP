<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Busão SP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="mapa"></div>

  <!-- busca -->
  <div id="topo" class="vidro">
    <form id="form-busca" class="caixa-busca">
      <input type="text" id="campo-busca" class="form-control border-0 shadow-none" placeholder="Buscar ponto de ônibus" required>
      <button class="btn btn-primary rounded-pill px-3">Buscar</button>
    </form>

    <div id="chips" class="mt-2">
      <button id="chip-ponto" class="chip ativo" onclick="trocarModo('ponto')">Pontos</button>
      <button id="chip-linha" class="chip" onclick="trocarModo('linha')">Linhas</button>
      <span id="favoritos"></span>
    </div>
  </div>

  <!-- painel da esquerda (no celular fica embaixo) -->
  <div id="painel" class="vidro d-none">

    <div id="resultados" class="list-group list-group-flush"></div>

    <div id="detalhe-ponto" class="d-none">
      <div class="p-3 border-bottom">
        <button class="btn btn-link p-0 mb-2" onclick="voltar()">&larr; Voltar</button>
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h2 id="nome-ponto" class="h5 mb-0"></h2>
            <small class="text-muted">Atualizado às <span id="hora-ponto"></span></small>
          </div>
          <button id="botao-favorito" class="btn btn-outline-primary btn-sm rounded-pill" onclick="salvarFavorito()"></button>
        </div>
        <div class="form-check form-switch mt-2">
          <input class="form-check-input" type="checkbox" id="so-acessiveis" onchange="mostrarPrevisao()">
          <label class="form-check-label" for="so-acessiveis">Só ônibus acessíveis</label>
        </div>
      </div>
      <ul id="lista-previsao" class="list-group list-group-flush"></ul>
    </div>

    <div id="detalhe-linha" class="d-none p-3">
      <button class="btn btn-link p-0 mb-2" onclick="voltar()">&larr; Voltar</button>
      <h2 id="nome-linha" class="h5"></h2>
      <p id="info-linha" class="text-muted mb-0"></p>
      <h3 class="h6 mt-3">Pontos da linha</h3>
      <ul id="paradas-linha" class="small mb-0 ps-3"></ul>
    </div>

    <p class="credito">Dados fornecidos pela SPTrans (API Olho Vivo)</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ponto.js"></script>
  <script src="js/linha.js"></script>
</body>
</html>
